name: CI

on:
  push:
    branches: [main]
    tags:
      - "*"
    paths-ignore:
      - "samples/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "samples/**"

jobs:
  build:
    name: Build Cap'n Proto ${{ matrix.capnp_version }}
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capnp_version: "v1"
            capnp_ref: "v1.4.0"
            cxx_standard: "17"
            cxx_compiler: "c++"
          - capnp_version: "2.0-dev"
            capnp_ref: "v2"
            cxx_standard: "23"
            cxx_compiler: "g++-14"
    steps:
      - name: Checkout capnp-ls
        uses: actions/checkout@v4

      - name: Checkout Cap'n Proto
        uses: actions/checkout@v4
        with:
          repository: capnproto/capnproto
          ref: ${{ matrix.capnp_ref }}
          path: capnproto

      - name: Install GCC 14
        if: matrix.cxx_compiler == 'g++-14'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Configure
        env:
          CXX: ${{ matrix.cxx_compiler }}
        run: |
          cmake -B build-${{ matrix.capnp_version }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} \
            -DCAPNP_SOURCE_DIR="${GITHUB_WORKSPACE}/capnproto/c++" .

      - name: Build
        run: cmake --build build-${{ matrix.capnp_version }}

      - name: Test
        run: ctest --test-dir build-${{ matrix.capnp_version }} --output-on-failure

  build_release:
    name: Release Cap'n Proto ${{ matrix.capnp_channel }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capnp_channel: "v1"
            capnp_ref: "v1.4.0"
            cxx_standard: "17"
            cxx_compiler: "c++"
          - capnp_channel: "v2"
            capnp_ref: "v2"
            cxx_standard: "23"
            cxx_compiler: "g++-14"
    steps:
      - name: Checkout capnp-ls
        uses: actions/checkout@v4

      - name: Checkout Cap'n Proto
        uses: actions/checkout@v4
        with:
          repository: capnproto/capnproto
          ref: ${{ matrix.capnp_ref }}
          path: capnproto

      - name: Install GCC 14
        if: matrix.cxx_compiler == 'g++-14'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Configure
        env:
          CXX: ${{ matrix.cxx_compiler }}
        run: |
          cmake -B build-${{ matrix.capnp_channel }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} \
            -DCAPNP_SOURCE_DIR="${GITHUB_WORKSPACE}/capnproto/c++" .

      - name: Build
        run: cmake --build build-${{ matrix.capnp_channel }}

      - name: Test
        run: ctest --test-dir build-${{ matrix.capnp_channel }} --output-on-failure

      - name: Rename Binary
        run: |
          mv \
            build-${{ matrix.capnp_channel }}/capnp-ls \
            build-${{ matrix.capnp_channel }}/capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_channel }}

      - name: Generate Checksum
        run: |
          cd build-${{ matrix.capnp_channel }}
          sha256sum capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_channel }} \
            > capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_channel }}.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_channel }}
          path: |
            build-${{ matrix.capnp_channel }}/capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_channel }}
            build-${{ matrix.capnp_channel }}/capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_channel }}.sha256

  release:
    name: Create GitHub Release
    needs: [build_release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Grant Execute Permission
        run: chmod +x artifacts/*/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          prerelease: false
