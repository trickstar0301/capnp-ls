name: CI

on:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Cap'n Proto ${{ matrix.capnp_version }}
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capnp_version: "1.1.0"
            capnp_ref: "v1.1.0"
          - capnp_version: "1.2.0"
            capnp_ref: "v1.2.0"
          - capnp_version: "2.0-dev"
            capnp_ref: "v2"
    steps:
      - name: Checkout capnp-ls
        uses: actions/checkout@v4

      - name: Checkout Cap'n Proto
        uses: actions/checkout@v4
        with:
          repository: capnproto/capnproto
          ref: ${{ matrix.capnp_ref }}
          path: capnproto

      - name: Configure
        run: |
          cmake -B build-${{ matrix.capnp_version }} \
            -DCAPNP_SOURCE_DIR="${GITHUB_WORKSPACE}/capnproto/c++" .

      - name: Build
        run: cmake --build build-${{ matrix.capnp_version }}

      - name: Test
        run: ctest --test-dir build-${{ matrix.capnp_version }} --output-on-failure

  build_release:
    name: Release Cap'n Proto ${{ matrix.capnp_version }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capnp_version: "1.1.0"
            capnp_ref: "v1.1.0"
          - capnp_version: "1.2.0"
            capnp_ref: "v1.2.0"
          - capnp_version: "2.0-dev"
            capnp_ref: "v2"
    steps:
      - name: Checkout capnp-ls
        uses: actions/checkout@v4

      - name: Checkout Cap'n Proto
        uses: actions/checkout@v4
        with:
          repository: capnproto/capnproto
          ref: ${{ matrix.capnp_ref }}
          path: capnproto

      - name: Configure
        run: |
          cmake -B build-${{ matrix.capnp_version }} \
            -DCAPNP_SOURCE_DIR="${GITHUB_WORKSPACE}/capnproto/c++" .

      - name: Build
        run: cmake --build build-${{ matrix.capnp_version }}

      - name: Test
        run: ctest --test-dir build-${{ matrix.capnp_version }} --output-on-failure

      - name: Rename Binary
        run: |
          mv \
            build-${{ matrix.capnp_version }}/capnp-ls \
            build-${{ matrix.capnp_version }}/capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_version }}
          path: build-${{ matrix.capnp_version }}/capnp-ls-linux-x86_64-capnp-${{ matrix.capnp_version }}

  release:
    name: Create GitHub Release
    needs: [build_release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Grant Execute Permission
        run: chmod +x artifacts/*/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          prerelease: false
